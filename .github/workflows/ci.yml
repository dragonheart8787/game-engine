name: ci

on:
  push:
  pull_request:

jobs:
  structure-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check repository structure
        run: bash scripts/check-structure.sh
      - name: Check SDL isolation
        run: bash scripts/check_sdl_isolation.sh
      - name: Lint docs footprint
        run: bash scripts/lint-docs.sh

  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Run pytest
        run: pytest

  cpp-build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build C++ lane
        run: cmake --build build --config Release
      - name: Run ctest
        run: ctest --test-dir build --output-on-failure

  windows-sanity:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake (Windows)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build C++ lane (Windows)
        run: cmake --build build --config Release

  android-stub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Android stub script
        run: bash scripts/build_android_stub.sh
